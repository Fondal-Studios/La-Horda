# EJEMPLO para Apache 2.4 (alternativa a nginx). Va DENTRO del <VirtualHost *:443> de fondalstudios.com.
# Rutas públicas:
#   https://fondalstudios.com/la-horda/jugar/  -> el juego (estático, /var/www/la-horda/current)
#   https://fondalstudios.com/la-horda/red/    -> servidor de salas, cuentas y pagos (Node en 127.0.0.1:8787, prefijo recortado)
# Módulos necesarios (una sola vez):
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel rewrite headers deflate http2 expires
#   sudo cp deploy/apache/la-horda.conf /etc/apache2/conf-available/la-horda.conf   (y editarlo si cambian las rutas)
#   y en el <VirtualHost *:443> de fondalstudios.com agregar:   Include /etc/apache2/conf-available/la-horda.conf
#   (no uses a2enconf: lo activaría para todos los sitios del servidor)
#   sudo apachectl configtest && sudo systemctl reload apache2
# Guía: docs/commercial/DESPLIEGUE_FONDAL.md

# ---------- Cabeceras de seguridad ----------
# HSTS: arrancá con 86400 (1 día) y subí a 31536000 cuando todo funcione por HTTPS.
Header always set Strict-Transport-Security "max-age=86400"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# ---------- Compresión ----------
AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml

# ---------- Servidor de salas / cuentas / pagos ----------
# Apache, por defecto, AGREGA a X-Forwarded-For lo que mande el cliente. Acá se desactiva y se PISA con la IP verdadera:
# si no, cualquiera elegiría su IP y se saltearía los frenos de abuso (el servidor lee TRUST_PROXY=1).
# Se borran también las cabeceras de CDN que el servidor mira (cf-connecting-ip, true-client-ip, fly-client-ip).
# Si ponés Cloudflare adelante: usá  "%{HTTP:CF-Connecting-IP}e"... mejor mod_remoteip (ver la guía) y permití solo IPs de Cloudflare.
ProxyPreserveHost On
ProxyAddHeaders Off
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-Proto "https"
RequestHeader unset CF-Connecting-IP
RequestHeader unset True-Client-IP
RequestHeader unset Fly-Client-IP
# No tocar x-signature ni x-request-id: Mercado Pago firma el webhook con ellas. La query (?data.id=...) se conserva sola.

RewriteEngine On
# WebSocket (salas): se detecta por la cabecera Upgrade y se manda por ws://. OJO: el juego conecta a /la-horda/red SIN barra
# final y un WebSocket no sigue redirecciones: por eso "/?" (con o sin barra) va directo al servidor.
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/la-horda/red/?(.*)$ ws://127.0.0.1:8787/$1 [P,L]
# Ruta exacta sin barra (HTTP normal)
RewriteRule ^/la-horda/red$ http://127.0.0.1:8787/ [P,L]
# Resto de la API (HTTP). El timeout largo es por las conexiones de las salas.
ProxyPass        /la-horda/red/ http://127.0.0.1:8787/ timeout=3600 nocanon
ProxyPassReverse /la-horda/red/ http://127.0.0.1:8787/
# El guardado en la nube pesa hasta ~528 KB.
<Location "/la-horda/red/">
    LimitRequestBody 1048576
</Location>

# ---------- El juego (estático) ----------
Alias /la-horda/jugar/ /var/www/la-horda/current/
<Directory "/var/www/la-horda/current/">
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    # código y estilos: 5 minutos y se revalida; la portada y el service worker: siempre se pregunta; arte/audio: 1 día
    Header set Cache-Control "public, max-age=300, must-revalidate"
    <FilesMatch "^(index\.html|instalar\.html|crystal-wars\.html|sw\.js|sw-manifest\.json|deployment\.json|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
<Directory "/var/www/la-horda/current/assets/">
    Header set Cache-Control "public, max-age=86400"
</Directory>
RewriteRule ^/la-horda/jugar$ /la-horda/jugar/ [R=301,L]
