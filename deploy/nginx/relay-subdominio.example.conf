# VARIANTE: el servidor de salas, cuentas y pagos en su propio subdominio (red.fondalstudios.com) en vez de la ruta /la-horda/red/.
# Sirve para ensayar el servidor nuevo SIN tocar lo que hoy atiende https://fondalstudios.com/la-horda/red (por ejemplo, Fly.io).
# Pasos: 1) crear el registro DNS "red" (A/AAAA) hacia este servidor; 2) certificado:  sudo certbot --nginx -d red.fondalstudios.com
#        3) construir el sitio con GAME_RELAY_URL=wss://red.fondalstudios.com (ver la guía, sección 5);
#        4) PAYMENTS_NOTIFY_URL=https://red.fondalstudios.com/api/payments/webhook en el archivo de entorno.
# El nombre de host del servidor de salas queda confiable en el juego solo (el build lo escribe en net-config.js): no hay que
# editar js/net/*. En ALLOWED_ORIGINS va el ORIGEN DE LA PÁGINA (https://fondalstudios.com), no el del subdominio.
server {
    listen 80;
    listen [::]:80;
    server_name red.fondalstudios.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://red.fondalstudios.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name red.fondalstudios.com;
    ssl_certificate     /etc/letsencrypt/live/red.fondalstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/red.fondalstudios.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        include /etc/nginx/la-horda/la-horda-proxy.inc;
        include /etc/nginx/la-horda/la-horda-headers.inc;
        proxy_pass http://127.0.0.1:8787;   # sin barra final: no hay prefijo que recortar
    }
}
