# nginx — piezas que van a nivel "http" (fuera de cualquier server { }).
# Instalación:  sudo cp deploy/nginx/la-horda-http.conf /etc/nginx/conf.d/la-horda-http.conf
# (los archivos de /etc/nginx/conf.d/*.conf ya se cargan solos en la configuración estándar de Debian/Ubuntu).

# WebSocket: si el navegador pide "Upgrade", se lo pasamos al servidor de salas; si no, la conexión se cierra normal.
map $http_upgrade $lh_connection_upgrade {
    default upgrade;
    ''      close;
}

# Freno general contra inundaciones, ANTES de llegar al juego (el juego tiene los suyos por usuario/IP).
# 60 pedidos por segundo por IP con ráfaga de 120: holgado para un wifi de evento; frena a un script descontrolado.
limit_req_zone $binary_remote_addr zone=lh_api:10m rate=60r/s;
limit_req_status 429;

# Compresión para lo que se puede comprimir (los PNG/MP3/OGG ya vienen comprimidos).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
