# EJEMPLO COMPLETO para fondalstudios.com con nginx (HTTPS + juego + servidor de salas y pagos).
# Si el sitio YA tiene su server { }, NO copies este archivo entero: agregá solo la línea
#     include /etc/nginx/la-horda/la-horda-locations.inc;
# dentro de su server de 443 (y copiá la-horda-http.conf a /etc/nginx/conf.d/). Guía: docs/commercial/DESPLIEGUE_FONDAL.md
#
# Instalación de las piezas:
#   sudo install -d /etc/nginx/la-horda
#   sudo cp deploy/nginx/la-horda-*.inc /etc/nginx/la-horda/
#   sudo cp deploy/nginx/la-horda-http.conf /etc/nginx/conf.d/
#   sudo cp deploy/nginx/fondalstudios.example.conf /etc/nginx/sites-available/fondalstudios.com   (y editarlo)
#   sudo ln -s /etc/nginx/sites-available/fondalstudios.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificado gratis (Let's Encrypt):  sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d fondalstudios.com

server {
    listen 80;
    listen [::]:80;
    server_name fondalstudios.com www.fondalstudios.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://fondalstudios.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fondalstudios.com;

    ssl_certificate     /etc/letsencrypt/live/fondalstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fondalstudios.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LH_SSL:10m;
    ssl_session_tickets off;

    server_tokens off;

    # ---- La Horda ----
    include /etc/nginx/la-horda/la-horda-locations.inc;

    # ---- Lo que ya sirve tu sitio (reemplazá esto por tu configuración actual) ----
    root /var/www/fondalstudios;
    location / { try_files $uri $uri/ =404; }
}
