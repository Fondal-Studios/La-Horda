<!doctype html><meta charset="utf-8"><title>Maura · lanzamientos y kit</title><style>body{background:#171c17;color:#eee;font:16px monospace}section{display:flex;gap:32px;flex-wrap:wrap}canvas{image-rendering:pixelated;background:#30392c;border:1px solid #697057}small{display:block}</style><h1>Maura · lanzamientos y kit</h1><p>Vista de fuente; la aprobación compuesta se documenta en REVIEW.json.</p><section id="cards"></section><script>
const specs=[['Raíces','../cierre-08/roots.png',168,40,12],['Corteza','../cierre-08/bark.png',64,80,18],['Poda','../cierre-08/shears.png',152,152,12]];for(let s=0;s<3;s++)specs.push(['Lanzamiento H'+(s+1),'launch-atlas.png',24,24,4,s]);const rows=specs.map(([name,url,w,h,n,row=0])=>{const box=document.createElement('div'),c=document.createElement('canvas'),im=new Image();c.width=w;c.height=h;c.style.width=w*2+'px';c.style.height=h*2+'px';box.append(name,c);document.querySelector('#cards').append(box);im.src=url;return{c,im,w,h,n,row};});setInterval(()=>{for(const r of rows){if(!r.im.complete||!r.im.naturalWidth)continue;const g=r.c.getContext('2d'),f=Math.floor(performance.now()/100)%r.n;g.clearRect(0,0,r.w,r.h);g.drawImage(r.im,f*r.w,r.row*r.h,r.w,r.h,0,0,r.w,r.h);}},100);
</script><small>Reproducción de fuente a 100 ms por celda. El juego conserva sus relojes propios.</small>
