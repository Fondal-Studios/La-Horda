<!doctype html><meta charset="utf-8"><title>Morwen — cast identities</title><style>body{background:#241e28;color:#edd0a5;font:16px monospace}canvas,img{image-rendering:pixelated}canvas{width:128px;height:128px;border:1px solid #6e3a60;margin:16px}label{display:inline-block}</style><h1>Morwen: lanzamientos, 460 ms</h1><p>Frasco / sal / retorta. Identificadores aéreos, no áreas ni escudo persistente.</p><div id="views"></div><img src="launch-atlas.png"><script>const im=new Image(),rows=[];im.src='launch-atlas.png';for(let i=0;i<3;i++){const box=document.createElement('label');box.textContent=['Resina','Sal','Destilación'][i];const c=document.createElement('canvas');c.width=c.height=32;box.append(c);views.append(box);rows.push({c,im,slot:i});}function tick(t){for(const r of rows){const g=r.c.getContext('2d');g.clearRect(0,0,32,32);if(im.complete&&im.naturalWidth)g.drawImage(im,Math.floor(t/77)%6*32,r.slot*32,32,32,0,0,32,32);}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
