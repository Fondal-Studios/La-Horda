<!doctype html><meta charset="utf-8"><title>Ilkan — candidato NO INTEGRAR</title><style>body{background:#172027;color:#f2dfb0;font:16px sans-serif}img,canvas{image-rendering:pixelated;max-width:100%}section{display:flex;gap:20px;flex-wrap:wrap}article{max-width:46%}canvas{background:#263b30}</style><h1>Ilkan: primera pasada — NO INTEGRAR</h1><p>Dos marcadores persistentes candidatos. Diagnóstico a 100 ms; el juego toma fase del temporizador restante. Sin aprobación integral.</p><section><article><h2>dune</h2><img id="dune" src="dune-atlas.png"><canvas width="64" height="72" data-kind="dune"></canvas></article><article><h2>caravan</h2><img id="caravan" src="caravan-atlas.png"><canvas width="64" height="72" data-kind="caravan"></canvas></article></section><h2>Mismo escenario y escala</h2><section><article><h3>H2 before</h3><img src="before-m/ilkan-1-native500.png"></article><article><h3>H2 after</h3><img src="after-m/ilkan-1-native500.png"></article><article><h3>H3 before</h3><img src="before-m/ilkan-2-native500.png"></article><article><h3>H3 after</h3><img src="after-m/ilkan-2-native500.png"></article></section><h2>Relay real horizontal táctil</h2><img src="online-guest.png"><script>let f=0;setInterval(()=>{for(const c of document.querySelectorAll("canvas")){const im=document.getElementById(c.dataset.kind),g=c.getContext("2d");if(im.complete&&im.naturalWidth){g.clearRect(0,0,64,72);g.drawImage(im,f*64,0,64,72,0,0,64,72);}}f=(f+1)%12},100);</script>
