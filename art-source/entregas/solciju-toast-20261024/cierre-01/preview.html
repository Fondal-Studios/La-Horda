<!doctype html><meta charset="utf-8"><title>Solciju — copa de lanzamiento</title><style>body{background:#151722;color:#eee;font:16px monospace}canvas,img{image-rendering:pixelated}canvas{border:1px solid #888}img{max-width:100%}</style><h1>Copa de Brindis — componente B210</h1><p>Atlas nativo24px,10fases. Preview diagnóstico90ms/fase; las capturas usan el renderer real.</p><canvas width="56" height="56"></canvas><img src="so_toast-bosque.png"><p>Antes/después en el mismo cuadro</p><img src="review/mobile-infernal.png"><script>let im=new Image();im.src='so_toast-bosque.png';let g=document.querySelector('canvas').getContext('2d');g.imageSmoothingEnabled=false;let i=0;im.onload=()=>setInterval(()=>{g.clearRect(0,0,56,56);g.drawImage(im,(i++%10)*24,0,24,24,0,0,56,56)},90);</script>
