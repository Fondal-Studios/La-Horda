<!doctype html><meta charset="utf-8"><title>Brakk — firmas normales</title><style>body{background:#171b22;color:#eee;font:16px monospace}canvas,img{image-rendering:pixelated}canvas{background:#30363f;margin:12px}</style><h1>Brakk: firmas normales</h1><p>Fuente nativa: 2 motivos × 4 separaciones. Evento real 460 ms; montaje 92 ms. Comparación en juego en sheets/.</p><img src="atlases/signature-native-source.png"><div id="previews"></div><script>const im=new Image();im.src='atlases/signature-native-source.png';im.onload=()=>{for(let slot=0;slot<2;slot++){const cv=document.createElement('canvas');cv.width=96;cv.height=80;previews.append(cv);const c=cv.getContext('2d');c.imageSmoothingEnabled=false;const draw=t=>{c.clearRect(0,0,96,80);let elapsed=t%1200;if(elapsed<460){let q=elapsed/460,gap=Math.round(3*(1-Math.min(1,q*5)));c.globalAlpha=Math.min(1,(1-q)*3)*.85;c.drawImage(im,gap*48,slot*40,48,40,0,0,96,80);}requestAnimationFrame(draw)};requestAnimationFrame(draw)}};</script>
