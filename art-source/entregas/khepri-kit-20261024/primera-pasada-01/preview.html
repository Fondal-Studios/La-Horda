<!doctype html><meta charset="utf-8"><title>Khepri — candidatos sin instalar</title><style>body{background:#192128;color:#eef0d5;font:16px monospace}canvas,img{image-rendering:pixelated}section{padding:20px}canvas{border:1px solid #677;width:auto}p{max-width:800px}</style><h1>Khepri: primera pasada</h1><p>EN_CORRECCION. Caparazón y élitros candidatos sin instalar. Animación diagnóstica de 100ms por cuadro: no representa duración real. H1, cuerpo y definitiva existentes conservados.</p><section>Caparazón Vivo<br><canvas id="carapace" width="80" height="72"></canvas><br><img src="carapace.png"></section><section>Vuelo de Élitros<br><canvas id="elytra" width="96" height="48"></canvas><br><img src="elytra.png"></section><script src="source.js"></script><script>let frame=0;setInterval(()=>{for(const [key,s]of Object.entries(KHEPRI_CANDIDATE.specs)){let c=document.getElementById(key),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);KHEPRI_CANDIDATE.draw(x,key,frame%s.n);}frame++;},100);</script>
