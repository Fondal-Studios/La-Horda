<!doctype html><meta charset="utf-8"><title>Veyra — corazón de lanzamiento</title><style>body{background:#17151e;color:#eee;font:16px sans-serif}canvas{image-rendering:pixelated;border:1px solid #555;margin:10px}</style><h1>Pacto — lanzamiento</h1><p>10 fases nativas · diagnóstico 76 ms · el latido del suelo sigue pendiente.</p><div id="a"></div><script>for(const ar of ['bosque','hielo','infernal','laberinto','acuatica','minas']){const c=document.createElement('canvas');c.width=c.height=96;a.append(c);const im=new Image();im.src='vy_pact-'+ar+'.png';im.onload=()=>{let f=0;setInterval(()=>{const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,96,96);g.drawImage(im,f*24,0,24,24,0,0,96,96);f=(f+1)%10},76)}}</script>
