<!doctype html><meta charset="utf-8"><title>Iria: candidatos NO INTEGRAR</title><style>body{background:#151821;color:#eee;font:16px sans-serif}canvas{image-rendering:pixelated;background:#28302d;margin:12px}img{image-rendering:pixelated;max-width:100%}</style><h1>Iria — primera pasada / NO INTEGRAR</h1><p>Animación diagnóstica 100ms, no timing del juego. Corte aún sin consumidor.</p><div id="pre"></div><script>for(const [k,w,h,n] of [['anchor',32,48,18],['tension',200,24,16],['cut',104,104,10]]){const im=new Image(),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.width=w*2+'px';cv.style.height=h*2+'px';pre.append(cv);im.src=k+'.png';im.onload=()=>setInterval(()=>{const g=cv.getContext('2d'),f=Math.floor(performance.now()/100)%n;g.clearRect(0,0,w,h);g.drawImage(im,f*w,0,w,h,0,0,w,h)},100)}</script><h2>Antes/después móvil</h2><img src="mobile-before.png"><img src="mobile-after.png">
