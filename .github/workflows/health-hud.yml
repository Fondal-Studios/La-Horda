name: Health HUD visual regression
on:
  pull_request:
    paths: ['js/systems/hero-stats.js', 'js/systems/potions.js', 'js/ui/hud.js', 'css/hud.css', 'index.html', 'tools/regression/test-health-hud.js', '.github/workflows/health-hud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - run: node tools/regression/test-health-hud.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-hud
          path: docs/quality/health-hud/
