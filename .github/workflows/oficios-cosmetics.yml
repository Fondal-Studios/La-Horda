name: Oficios authored cosmetics
on:
  pull_request:
    paths: ['assets/sprites/champions/farolero/skins/farolero_guardavia/**', 'assets/sprites/champions/dariel/skins/dariel_luthier/**', 'assets/sprites/champions/eslabon/skins/eslabon_porcelana/**', 'assets/sprites/champions/morwen/skins/morwen_escarcha/**', 'art-source/entregas/cosmetics-20261019/**', 'tools/art/cosmetics-20261019.json', 'js/assets/quality-five-skins-meta.js', 'js/data/champion-art-normalize.js', 'tools/art/test-brasa-abyssal*.js', 'tools/art/unique_skins/check.js', '.github/workflows/oficios-cosmetics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oficios-cosmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/horda-brasa/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix /tmp/horda-brasa --no-audit --no-fund playwright@1.56.1
      - run: /tmp/horda-brasa/node_modules/.bin/playwright install --with-deps chromium
      - run: npm ci --prefix server --no-audit --no-fund
      - run: python -m pip install numpy pillow scipy opencv-python-headless
      - name: Reproducible factory and style gate
        run: |
          set -e
          for pair in eslabon:eslabon_porcelana morwen:morwen_escarcha; do
            champ=${pair%%:*}; skin=${pair#*:}
            python tools/factory/import-authored-sheet.py "art-source/entregas/cosmetics-20261019/$skin/fuentes/importacion.json" "/tmp/$skin"
            cmp "/tmp/$skin/atlas.png" "assets/sprites/champions/$champ/skins/$skin/atlas.png"
            python tools/art/painter/style_gate.py "assets/sprites/champions/$champ/skins/$skin/atlas.png"
          done
          python art-source/entregas/cosmetics-20261019/dariel_luthier/revision-v3/reproduce.py
          python tools/art/painter/style_gate.py --strict assets/sprites/champions/dariel/skins/dariel_luthier/atlas.png
          python art-source/entregas/cosmetics-20261019/farolero_guardavia/revision-v6/reproduce.py
          python tools/art/painter/style_gate.py --strict assets/sprites/champions/farolero/skins/farolero_guardavia/atlas.png
          node tools/factory/cli.js gate reference
          node tools/factory/cli.js gate talents
      - name: Real cosmetic and roster regression
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          export PLAYWRIGHT_EXECUTABLE_PATH="$CHROMIUM_PATH"
          python3 -m http.server 8775 --bind 127.0.0.1 >/tmp/brasa-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export SE_BASE_URL=http://127.0.0.1:8775 ROSTER_BASE_URL=http://127.0.0.1:8775
          sleep 1
          node tools/art/roster_gate.js
          node tools/art/unique_skins/check.js
          node tools/collection/shop-pricing-browser.js
          for skin in eslabon_porcelana morwen_escarcha dariel_luthier farolero_guardavia; do
            COSMETIC_ID="$skin" node tools/art/test-brasa-abyssal.js
            COSMETIC_ID="$skin" node tools/art/test-brasa-abyssal-online.js
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oficios-cosmetic-evidence
          path: art-source/entregas/cosmetics-20261019/*/runtime/
