name: Libertador motion component gate
on:
  pull_request:
    paths: ['assets/sprites/champions/libertador/v3/**', 'js/assets/champion-sprites.js', 'js/champions/libertador.js', 'js/data/champion-art-normalize.js', 'tools/art/check-libertador-motion.js', 'tools/factory/repair-outline-gaps.py', 'tools/factory/test_outline_gaps.py', 'docs/art-gate/libertador-motion/**', 'art-source/entregas/bloques/B004_libertador/**', 'tools/factory/extract-authored-clip.py', 'tools/art/check-authored-density.js', '.github/workflows/libertador-motion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow numpy scipy opencv-python-headless
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest tools/factory/test_outline_gaps.py tools/factory/test_authored_clip.py tools/factory/test_authored_frame.py
      - name: Exact extraction from the approved Codex-design source and scanner
        run: |
          python tools/factory/extract-authored-clip.py docs/art-gate/libertador-motion/source.json /tmp/motion.png /tmp/extraction.json
          python -m pip install --quiet scipy
          python - <<'PY'
          import importlib.util
          from PIL import Image
          assert Image.open('/tmp/motion.png').tobytes() == Image.open('assets/sprites/champions/libertador/v3/motion.png').tobytes()
          s=importlib.util.spec_from_file_location('scan','tools/art/scan_sprites.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          for p in ('assets/sprites/champions/libertador/v3/motion.png','assets/sprites/champions/libertador/v2/atlas.png','assets/sprites/champions/libertador/v2/death.png'):
              r=m.analyze(p); assert r['halo']==r['semi']==r['fragments']==0,(p,r)
          PY
      - run: node tools/art/check-authored-clip-density.js assets/sprites/champions/libertador/v3/motion.png docs/art-gate/libertador-motion/native-source.json 1 12
      - run: node tools/art/check-libertador-motion.js
      - run: node tools/art/check-libertador-death.js
      - name: Existing roster and cosmetics
        run: |
          python -m http.server 8750 --bind 127.0.0.1 >/tmp/art-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          ROSTER_BASE_URL=http://127.0.0.1:8750 node tools/art/roster_gate.js
          SE_BASE_URL=http://127.0.0.1:8750 PACKS=libertador node tools/art/skin_audit.js docs/art-gate/libertador-motion/skins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libertador-motion-component
          path: docs/art-gate/
          retention-days: 30
