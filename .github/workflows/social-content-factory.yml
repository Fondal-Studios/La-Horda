name: Social content factory (review only)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1,3,5'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tools/social/capture.mjs
      - run: python tools/social/prepare.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-review-candidates
          path: social-output/
          if-no-files-found: warn
          retention-days: 14
