name: Idiomas (ES/EN/PT)
# Selector de idioma del menú + cobertura de traducciones. Ver docs/i18n/README.md
on:
  pull_request:
    paths: ['js/i18n/**', 'tools/i18n/**', 'docs/i18n/**', 'css/i18n.css', 'index.html', '.github/workflows/i18n.yml']
  push:
    branches: [main, 'claude/**']
    paths: ['js/i18n/**', 'tools/i18n/**', 'docs/i18n/**', 'css/i18n.css', 'index.html', '.github/workflows/i18n.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - name: "Diccionarios compilados == fuentes (tools/i18n/build.py)"
        run: |
          python3 tools/i18n/build.py
          git diff --exit-code js/i18n/en.js js/i18n/pt.js
      - name: "Selector, persistencia, ?lang=, vuelta a español"
        run: node tools/i18n/test-i18n.js
      - name: "Cobertura inglés (>= 97 %)"
        run: node tools/i18n/tour.js --check en
      - name: "Cobertura portugués (>= 97 %)"
        run: node tools/i18n/tour.js --check pt
