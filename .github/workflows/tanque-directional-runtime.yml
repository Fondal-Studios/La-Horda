name: Tanque directional runtime
on:
  pull_request:
    paths:
      - 'tools/art/tanque-directional-online.js'
      - 'tools/art/tanque-directional-perf.js'
      - '.github/workflows/tanque-directional-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node tools/art/tanque-directional-online.js
      - run: node tools/art/tanque-directional-perf.js
