name: Soporte master-reference visual preview
on:
  push:
    branches: ['art-workshop/soporte-master-preview-20261019']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Render real normalized bodies against master with same scale and flat background
        run: |
          python3 -m http.server 8750 --bind 127.0.0.1 >/tmp/visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node <<'JS'
          const fs=require('fs'),crypto=require('crypto'),{chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({args:['--no-sandbox']});
            try{
              const c=await b.newContext({viewport:{width:1100,height:900},serviceWorkers:'block'});
              await c.route('**/*',r=>{const u=new URL(r.request().url());return u.hostname==='127.0.0.1'||['data:','blob:'].includes(u.protocol)?r.continue():r.abort();});
              const p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.goto('http://127.0.0.1:8750/index.html',{waitUntil:'load'});
              await p.waitForFunction(()=>typeof drawHeroBody==='function'&&assetsAllReady());
              const result=await p.evaluate(()=>{
                loop=function(){};window.ART_GATE_NO_VFX=true;selectedClass='tanque';currentArena='bosque';startRun(1);state='paused';animNow=0;
                const keys=['tanque','soporte','guerrero','mago','cazadora'],dirs=[['frente',0,1],['perfil',1,0],['espalda',0,-1]];
                const canvas=document.createElement('canvas');canvas.width=800;canvas.height=800;
                const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#30343c';g.fillRect(0,0,800,800);g.font='16px monospace';
                const saved=ctx;
                try{keys.forEach((k,row)=>{
                  g.fillStyle='#fff';g.fillText(k=== 'tanque'?'tanque *':k,8,row*150+86);
                  dirs.forEach(([label,fx,fy],col)=>{
                    const x=210+col*225,y=row*150+135;
                    g.fillStyle='#cfd8df';g.fillText(label,x-40,row*150+20);
                    g.strokeStyle='#67ba94';g.beginPath();g.moveTo(x-95,y-4);g.lineTo(x+95,y-4);g.stroke();
                    const h=makeHero(k,true,0,0);Object.assign(h,{x:0,y:0,fx,fy,moving:false,attackAnim:0,hurtTimer:0,_packCastUntil:0,_codexSkin:null});
                    g.save();g.translate(x,y);g.scale(1.5,1.5);ctx=g;drawHeroBody(h,h.scale,false,false);g.restore();
                  });
                });}finally{ctx=saved;}
                g.fillStyle='#fff';g.fillText('* Master Reference; mismo zoom / fondo / sin VFX',8,785);
                return {png:canvas.toDataURL('image/png'),keys};
              });
              if(errors.length)throw Error(errors.join(' | '));
              const bytes=Buffer.from(result.png.split(',')[1],'base64'),encoded=bytes.toString('base64');
              fs.writeFileSync('/tmp/soporte-master.png',bytes);
              console.log('MASTER_META '+JSON.stringify({commit:process.env.GITHUB_SHA,keys:result.keys,errors,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),atlasSha256:crypto.createHash('sha256').update(fs.readFileSync('assets/sprites/champions/soporte/v3/atlas.png')).digest('hex')}));
              for(let n=0;n<encoded.length;n+=4096)console.log('MASTER_CHUNK '+JSON.stringify({index:n/4096,data:encoded.slice(n,n+4096)}));
            }finally{await b.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soporte-master-reference-preview
          path: /tmp/soporte-master.png
          retention-days: 30
