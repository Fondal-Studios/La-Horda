name: Skill icon baseline classification
on:
  pull_request:
    paths: ['.github/workflows/skill-icon-baseline-classification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-playwright
      - name: Run unmodified icon contract on candidate and full pinned main
        run: |
          BASELINE=34ac2852154035b97e53c4807a0a20ee289a40b2
          CANDIDATE="$PWD"
          OUT=/tmp/skill-icon-comparison
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/candidate-revision.txt"
          git fetch --depth=1 origin "$BASELINE"
          git worktree add --detach /tmp/skill-icon-main "$BASELINE"
          (cd /tmp/skill-icon-main && git rev-parse HEAD) > "$OUT/baseline-revision.txt"
          # Do not transplant production files or change any checker assertion.
          FILES='tools/art/check-skill-icons.js tools/lib/serve.js tools/lib/pw-tune.js tools/lib/http-ready.js'
          sha256sum $FILES > "$OUT/candidate-harness.sha256"
          (cd /tmp/skill-icon-main && sha256sum $FILES) > "$OUT/baseline-harness.sha256"
          cmp "$OUT/candidate-harness.sha256" "$OUT/baseline-harness.sha256"
          set -o pipefail
          set +e
          node tools/art/check-skill-icons.js --self-test 2>&1 | tee "$OUT/candidate.log"
          CANDIDATE_STATUS=${PIPESTATUS[0]}
          cd /tmp/skill-icon-main
          node tools/art/check-skill-icons.js --self-test 2>&1 | tee "$OUT/baseline.log"
          BASELINE_STATUS=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$CANDIDATE_STATUS" > "$OUT/candidate-exit.txt"
          printf '%s\n' "$BASELINE_STATUS" > "$OUT/baseline-exit.txt"
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('/tmp/skill-icon-comparison')
          result = {}
          for label in ('candidate', 'baseline'):
              log = (root / (label + '.log')).read_text()
              result[label] = {
                  'sha': (root / (label + '-revision.txt')).read_text().strip(),
                  'exit': int((root / (label + '-exit.txt')).read_text()),
                  'hud_summary': re.findall(r'^HUD 844x390:.*$', log, re.M),
                  'failures': re.findall(r'^ - (.*)$', log, re.M),
              }
          c, b = result['candidate'], result['baseline']
          result['classification'] = 'INCONCLUSIVE'
          if c['hud_summary'] and b['hud_summary']:
              if c['exit'] == b['exit'] == 0:
                  result['classification'] = 'BOTH_PASS'
              elif c['exit'] == b['exit'] == 1 and c['failures'] and c['failures'] == b['failures']:
                  result['classification'] = 'SAME_BASELINE_FAILURES_NOT_A_PASS'
              else:
                  result['classification'] = 'DIFFERENT_RESULTS_REVIEW_REQUIRED'
          text = json.dumps(result, indent=2, ensure_ascii=False)
          (root / 'comparison.json').write_text(text)
          print(text)
          PY
          # Diagnostic classification does not turn a real contract violation green.
          test "$CANDIDATE_STATUS" -eq 0 && test "$BASELINE_STATUS" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-icon-baseline-evidence
          path: /tmp/skill-icon-comparison/
          retention-days: 14
