name: Coliseum cover verification
on:
  push:
    branches: [codex/umbral-art]
permissions:
  contents: read
jobs:
  coliseum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix /tmp/horda-test playwright@1.58.2
      - run: /tmp/horda-test/node_modules/.bin/playwright install --with-deps chromium
      - run: node tools/art/check-coliseum-cover.js
        env:
          NODE_PATH: /tmp/horda-test/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coliseum-cover-evidence
          path: docs/coliseum-cover/
