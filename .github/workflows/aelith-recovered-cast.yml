name: Aelith recovered back cast
on:
  pull_request:
    paths: ['tools/art/aelith-recovery/**', 'art-source/aelith-recovery-20261102/**', 'assets/sprites/champions/aelith/**', 'js/champions/ascension/art.js', 'js/assets/champion-sprites.js', 'js/rendering/**', 'js/systems/set-effects.js', 'js/systems/cromas.js', '.github/workflows/aelith-recovered-cast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
      - run: npm install --prefix /tmp/horda-integracion --no-save --no-audit --no-fund @napi-rs/canvas@0.1.100
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pillow
      - run: python -m unittest discover -s tools/art/aelith-recovery -p test_reconstruct.py
      - run: node --test tools/art/aelith-recovery/test.js
      - run: node tools/art/aelith-recovery/runtime.js /tmp/aelith-recovered-native
      - run: node tools/art/aelith-recovery/browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aelith-recovered-cast-evidence
          path: |
            /tmp/aelith-recovered-native/
            /tmp/aelith-recovered-browser/
