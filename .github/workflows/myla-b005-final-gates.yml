name: Myla B005 final gates temporal
on:
  push:
    branches: [art/myla-cast-back-frame11-20261112]
permissions:
  contents: read
jobs:
  final-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --prefix /tmp/horda-art-tools playwright@1.58.2 @napi-rs/canvas@0.1.80 ws@8.18.0
      - run: /tmp/horda-art-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: node --check js/champions/vfx-b/myla.js && node tools/art/myla-codex-online.js && node tools/art/myla-codex-full-render-perf.js
        env:
          NODE_PATH: /tmp/horda-art-tools/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myla-b005-final-gates
          path: |
            art-source/entregas/bloques/B005_myla/cierre-cast-08/ONLINE.json
            art-source/entregas/bloques/B005_myla/cierre-cast-08/FULL_RENDER_PERFORMANCE.json
            art-source/entregas/bloques/B005_myla/cierre-cast-08/online-*.png
