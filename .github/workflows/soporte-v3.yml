name: Soporte v3 renderer and art gate
on:
  push:
    branches: ['chatgpt/soporte-atlas-integration-20261019']
  pull_request:
    paths: ['assets/sprites/champions/soporte/**', 'js/assets/champion-sprites.js', 'js/rendering/champion-sprites.js', 'js/data/champion-art-normalize.js', 'tools/art/check-soporte-v3.js', '.github/workflows/soporte-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Locate browser
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_PATH='+require('playwright').chromium.executablePath()+'\\n')"
      - run: node --check tools/art/check-soporte-v3.js
      - name: Actual casts and snapshots at six levels
        id: runtime
        continue-on-error: true
        run: node tools/art/check-soporte-v3.js
      - name: Existing roster and skin gates
        id: art
        continue-on-error: true
        run: |
          python3 -m http.server 8750 --bind 127.0.0.1 >/tmp/soporte-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          ROSTER_BASE_URL=http://127.0.0.1:8750 node tools/art/roster_gate.js
          SE_BASE_URL=http://127.0.0.1:8750 PACKS=soporte,skin_custodio,skin_baluarte node tools/art/skin_audit.js docs/art-gate/soporte-v3/skins
      - name: Emit diagnostic JSON
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ['docs/art-gate/soporte-v3/runtime.json','docs/art-gate/roster-gate.json','docs/art-gate/soporte-v3/skins/report.json']:
              p=pathlib.Path(name)
              if p.exists(): print('REPORT_BEGIN '+name+'\n'+p.read_text()+'REPORT_END '+name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soporte-v3-renderer-art
          path: docs/art-gate/
          retention-days: 30
      - name: Require both real checks
        if: always()
        run: |
          test "${{ steps.runtime.outcome }}" = success
          test "${{ steps.art.outcome }}" = success
